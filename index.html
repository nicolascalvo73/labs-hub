<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mondi Studio — Labs</title>
  <meta name="description" content="Propuestas de rediseño web de Mondi Studio para pymes." />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Crect width=%2724%27 height=%2724%27 rx=%276%27 fill=%27%234c6fff%27/%3E%3Ctext x=%2712%27 y=%2717%27 text-anchor=%27middle%27 font-family=%27Arial%27 font-weight=%27700%27 font-size=%2714%27 fill=%27white%27%3EM%3C/text%3E%3C/svg%3E" />
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #0f1117;
      color: #eef1f6;
      padding: 1.5rem;
    }
    main { max-width: 56rem; margin-inline: auto; }

    .top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 2.5rem;
    }
    .back {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      min-height: 2.75rem;
      padding: 0 1.1rem;
      border: 1px solid #2b3140;
      border-radius: 999px;
      color: #eef1f6;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }
    .back:hover { border-color: #4c6fff; background: #171a23; }
    .back svg { flex-shrink: 0; }

    h1 { font-size: clamp(1.5rem, 1.1rem + 1.5vw, 2rem); margin: 0; }
    p.lead { color: #a3acbd; margin: 0 0 2rem; }

    ul.cards { list-style: none; margin: 0; padding: 0; display: grid; gap: 1.25rem; grid-template-columns: 1fr; }
    @media (min-width: 40rem) { ul.cards { grid-template-columns: 1fr 1fr; } }

    a.card {
      display: block;
      border: 1px solid #262b38;
      border-radius: 16px;
      background: #171a23;
      color: inherit;
      text-decoration: none;
      overflow: hidden;
      transition: border-color 0.15s ease, transform 0.15s ease;
    }
    a.card:hover { border-color: #4c6fff; transform: translateY(-2px); }
    .card__thumb { display: block; width: 100%; height: auto; aspect-ratio: 16 / 10; object-fit: cover; object-position: top; background: #0b0d12; }
    .card__body { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1rem 1.25rem; }
    .card__name { font-weight: 700; }
    .card__arrow { color: #4c6fff; flex-shrink: 0; }

    footer { margin-top: 2.5rem; font-size: 0.8125rem; color: #6b7688; }
    footer a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <div class="top">
      <h1>Labs de Mondi Studio</h1>
      <a class="back" href="https://www.mondistudio.com.ar/">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Volver a Mondi Studio
      </a>
    </div>

    <p class="lead">Propuestas de rediseño web en desarrollo. Cada una vive en su propio repositorio.</p>

    <ul class="cards">
      <li>
        <a class="card" href="/quimica-dalton/">
          <img class="card__thumb" src="/assets/thumbs/quimica-dalton.webp" alt="Vista previa de la landing de Química Dalton" width="640" height="400" loading="lazy" />
          <div class="card__body">
            <span class="card__name">Química Dalton</span>
            <span class="card__arrow" aria-hidden="true">→</span>
          </div>
        </a>
      </li>
      <li>
        <a class="card" href="/retiro-yoga-swami/">
          <img class="card__thumb" src="/assets/thumbs/retiro-yoga-swami.webp" alt="Vista previa del sitio del retiro de yoga con Swami Sachidanand" width="640" height="400" loading="lazy" />
          <div class="card__body">
            <span class="card__name">Retiro de Yoga con Swami</span>
            <span class="card__arrow" aria-hidden="true">→</span>
          </div>
        </a>
      </li>
    </ul>

    <footer>Este dominio reenvía cada ruta al sitio publicado de cada propuesta. <a href="https://www.mondistudio.com.ar/">mondistudio.com.ar</a></footer>
  </main>
</body>
</html>
