<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mondi Studio — Labs</title>
  <meta name="description" content="Propuestas de rediseño web de Mondi Studio para pymes." />
  <meta name="robots" content="noindex" />
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #0f1117; color: #eef1f6; }
    main { max-width: 34rem; width: 100%; }
    h1 { font-size: clamp(1.5rem, 1.1rem + 1.5vw, 2rem); margin: 0 0 0.5rem; }
    p.lead { color: #a3acbd; margin: 0 0 2rem; }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.75rem; }
    a.proposal { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 1rem 1.25rem; border: 1px solid #262b38; border-radius: 12px; background: #171a23; color: inherit; text-decoration: none; transition: border-color 0.15s ease, background-color 0.15s ease; }
    a.proposal:hover { border-color: #4c6fff; background: #1b1f2b; }
    a.proposal span.arrow { color: #4c6fff; }
    footer { margin-top: 2.5rem; font-size: 0.8125rem; color: #6b7688; }
    footer a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <h1>Labs de Mondi Studio</h1>
    <p class="lead">Propuestas de rediseño web en desarrollo. Cada una vive en su propio repositorio.</p>
    <ul>
      <li><a class="proposal" href="/quimica-dalton/"><span>Química Dalton</span><span class="arrow">→</span></a></li>
    </ul>
    <footer>Este dominio reenvía cada ruta a su sitio en GitHub Pages. <a href="https://mondistudio.com.ar">mondistudio.com.ar</a></footer>
  </main>
</body>
</html>
